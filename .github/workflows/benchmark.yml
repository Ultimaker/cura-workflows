name: Benchmark

on:
  workflow_call:
    inputs:
      conan_extra_args:
        required: false
        default: ""
        type: string

      benchmark_cmd:
        required: true
        type: string

      name:
        required: true
        type: string

      output_file_path:
        required: true
        type: string

      data_dir:
        required: true
        type: string

      tool:
        required: true
        type: string

      conan_internal:
        required: false
        default: false
        type: boolean

      alert_comment_cc_users:
        required: false
        default: ""
        type: string

      alert_threshold:
        required: false
        default: "150%"
        type: string

      baseline_runs:
        required: false
        default: 10
        type: number

      package_overrides:
        required: false
        default: ""
        type: string

      cura_workflows_branch:
        description: "Branch of Ultimaker/Cura-workflows to pull runner_scripts from (for testing this workflow's own branch)"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Setup the build environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          install_system_dependencies: true
          cura_workflows_branch: ${{ inputs.cura_workflows_branch }}

      - name: Set package overrides
        id: set_overrides
        if: inputs.package_overrides != ''
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ${{ inputs.package_overrides }}
          profile: cura.jinja

      - name: Install dependencies and build
        run: conan build . --profile "${{ steps.set_overrides.outputs.profile || 'cura.jinja' }}" -s build_type=Release --build=missing --update -g VirtualRunEnv ${{ inputs.conan_extra_args }}

      - name: Run benchmark
        id: run-test
        run: |
          source generators/conanrun.sh
          ${{ inputs.benchmark_cmd }}
        working-directory: build/Release

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ inputs.name }}
          output-file-path: build/Release/${{ inputs.output_file_path }}
          gh-repository: github.com/Ultimaker/CuraEngineBenchmarks
          gh-pages-branch: main
          benchmark-data-dir-path: ${{ inputs.data_dir }}
          tool: ${{ inputs.tool }}
          github-token: ${{ secrets.CURA_BENCHMARK_PAT }}
          auto-push: true
          max-items-in-chart: 250
          # Alerting is handled by the "Check for performance regression" step below, which compares
          # against the average of the last N runs instead of only the single previous run.
          comment-on-alert: false

      - name: Check for performance regression
        id: check-regression
        run: |
          # benchmark-data-repository/ is the gh-pages clone left behind by the previous step after its push.
          python Cura-workflows/runner_scripts/check_benchmark_regression.py \
            --data-js-path "benchmark-data-repository/${{ inputs.data_dir }}/data.js" \
            --name "${{ inputs.name }}" \
            --tool "${{ inputs.tool }}" \
            --baseline-runs "${{ inputs.baseline_runs }}" \
            --alert-threshold "${{ inputs.alert_threshold }}" \
            --cc-users "${{ inputs.alert_comment_cc_users }}" \
            --comment-body-path "${{ runner.temp }}/benchmark-report.md"

      - name: Comment benchmark results on the pull request
        if: steps.check-regression.outputs.has_report == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_BODY_PATH, 'utf8');
            // The first line of the report is a hidden marker identifying this benchmark's comment.
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          COMMENT_BODY_PATH: ${{ runner.temp }}/benchmark-report.md

      - name: Comment on regression (commit)
        if: steps.check-regression.outputs.has_alert == 'true' && inputs.alert_comment_cc_users != '' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_BODY_PATH, 'utf8');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
        env:
          COMMENT_BODY_PATH: ${{ runner.temp }}/benchmark-report.md
