# composite action, not to be run on its own, but included at the beginning of a build script

name: 'Setup the build environment'
description: 'Clones the required repositories, and properly sets Python and conan up'

inputs:
  repository:
    required: false
    default: ''
    type: string

  conan_user:
    required: false
    default: ''
    type: string

  conan_password:
    required: false
    default: ''
    type: string

  private_data:
    required: false
    default: false
    type: boolean

  install_system_dependencies:
    required: false
    default: false
    type: boolean

  branch:
    required: false
    default: ''
    type: string

  repository_path:
    required: false
    default: '.'
    type: string

  python_set_env_vars:
    required: false
    default: true
    type: boolean

  conan_config_branch:
    required: false
    default: 'master'
    type: string

  cura_workflows_branch:
    required: false
    default: 'main'
    type: string

  download_lfs_files:
    required: false
    default: false
    type: boolean

  cleanup_workspace:
    required: false
    default: true
    type: boolean

outputs:
  package_name:
    value: ${{ steps.setup-environment.outputs.package_name }}
  package_version:
    value: ${{ steps.setup-environment.outputs.package_version }}
  python-path:
    value: ${{ steps.python-identity.outputs.python-path }}
  python-base-prefix:
    value: ${{ steps.python-identity.outputs.python-base-prefix }}
  python-version:
    value: ${{ steps.python-identity.outputs.python-version }}
  python-machine:
    value: ${{ steps.python-identity.outputs.python-machine }}

runs:
  using: "composite"
  steps:
    - name: Cleanup workspace
      if: ${{ inputs.cleanup_workspace == 'true' }}
      shell: bash
      run: |
        set -e
        find . -mindepth 1 -delete

    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}
        path: ${{ inputs.repository_path }}

    - name: Checkout Cura-workflows repo
      uses: actions/checkout@v6
      with:
        repository: Ultimaker/Cura-workflows
        path: Cura-workflows
        ref: ${{ inputs.cura_workflows_branch }}

    - name: Verify Cura-workflows checkout
      shell: bash
      run: |
        set -euo pipefail
        requested='${{ inputs.cura_workflows_branch }}'
        resolved=$(git -C Cura-workflows rev-parse HEAD)
        echo "Requested Cura-workflows ref: $requested"
        echo "Resolved Cura-workflows SHA: $resolved"
        if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "${resolved,,}" != "${requested,,}" ]]; then
          echo "Cura-workflows checkout mismatch: requested $requested, resolved $resolved" >&2
          exit 1
        fi

    - name: Install system dependencies
      shell: bash
      run: |
        if [ "${{ inputs.install_system_dependencies }}" == "true" ]; then
          if [[ "$OSTYPE" == "linux-gnu"* ]]; then
            chmod +x Cura-workflows/runner_scripts/ubuntu_setup.sh
            sudo ./Cura-workflows/runner_scripts/ubuntu_setup.sh
          elif [[ "$OSTYPE" == "darwin"* ]]; then
            chmod +x Cura-workflows/runner_scripts/macos_setup.sh
            ./Cura-workflows/runner_scripts/macos_setup.sh
          fi
        fi

    - name: Download git LFS content
      shell: bash
      run: |
        if [ "${{ inputs.download_lfs_files }}" == "true" ]; then
          cd "${{ inputs.repository_path }}"
          git lfs install
          git lfs pull
        fi

    - name: Setup Python and pip
      uses: actions/setup-python@v6
      id: setup-python
      if: ${{ !(runner.arch == 'ARM64' && runner.os == 'Windows') }}
      with:
        update-environment: ${{ inputs.python_set_env_vars }}
        python-version: '3.13'

    - name: Setup Python (Windows ARM64)
      id: setup-python-win-arm
      if: ${{ runner.arch == 'ARM64' && runner.os == 'Windows' }}
      shell: powershell
      run: |
        $pyExe = (Get-Command python.exe -ErrorAction Stop).Source
        $arch = & $pyExe -c "import platform; print(platform.machine())"
        if ($arch -ne "ARM64") {
            throw "python.exe in PATH is $arch, not ARM64. Check runner setup."
        }
        Write-Host "Using ARM64 Python at: $pyExe"
        echo "python-path=$pyExe" >> $env:GITHUB_OUTPUT

    - name: Record Python identity
      id: python-identity
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_ARCH" == "ARM64" && "$RUNNER_OS" == "Windows" ]]; then
          python_exe='${{ steps.setup-python-win-arm.outputs.python-path }}'
        else
          python_exe='${{ steps.setup-python.outputs.python-path }}'
        fi
        python_base_prefix=$("$python_exe" -c "import sys; print(sys.base_prefix)")
        python_version=$("$python_exe" -c "import platform; print(platform.python_version())")
        python_machine=$("$python_exe" -c "import platform; print(platform.machine())")
        echo "python-path=$python_exe" >> "$GITHUB_OUTPUT"
        echo "python-base-prefix=$python_base_prefix" >> "$GITHUB_OUTPUT"
        echo "python-version=$python_version" >> "$GITHUB_OUTPUT"
        echo "python-machine=$python_machine" >> "$GITHUB_OUTPUT"
        if [[ "$RUNNER_ARCH" == "ARM64" && "$RUNNER_OS" == "Windows" && "$python_machine" != "ARM64" ]]; then
          echo "Native ARM64 Python is required, got $python_machine" >&2
          exit 1
        fi

    - name: Install Python requirements and setup Conan environment (Bash)
      id: setup-environment
      shell: bash
      run: |
        if [[ "${{ inputs.python_set_env_vars }}" == "false" ]]; then
          if [[ "$RUNNER_ARCH" == "ARM64" && "$RUNNER_OS" == "Windows" ]]; then
            pydir="$(dirname "${{ steps.setup-python-win-arm.outputs.python-path }}")"
          else
            pydir="$(dirname "${{ steps.setup-python.outputs.python-path }}")"
          fi
          PATH+=":$pydir:$pydir/Scripts"
          echo $pydir >> pydir.txt
          echo "Installed Python for GitHub in: $pydir"
        fi

        python -m pip install -r Cura-workflows/.github/workflows/requirements-runner.txt

        conan profile detect -f
        conan config install https://github.com/Ultimaker/conan-config.git -a "-b ${{ inputs.conan_config_branch }}"

        if [ "${{ inputs.conan_user }}" != "" ] && [ "${{ inputs.conan_password }}" != "" ]; then
          conan remote login cura-conan2 ${{ inputs.conan_user }} -p ${{ inputs.conan_password }}
        fi

        if [ "${{ inputs.private_data }}" == "true" ]; then
          conan remote enable cura-private-conan2
          if [ "${{ inputs.conan_user }}" != "" ] && [ "${{ inputs.conan_password }}" != "" ]; then
            conan remote login cura-private-conan2 ${{ inputs.conan_user }} -p ${{ inputs.conan_password }}
          fi
        fi

        if [[ -f ${{ inputs.repository_path }}/conanfile.py ]]; then
          conan inspect ${{ inputs.repository_path }} > package_details.txt
          package_name=$(cat package_details.txt | awk '/^name:/ {print $2}')
          package_version=$(cat package_details.txt | awk '/^version:/ {print $2}')
          echo "package_name=$package_name" >> $GITHUB_OUTPUT
          echo "package_version=$package_version" >> $GITHUB_OUTPUT
        fi
